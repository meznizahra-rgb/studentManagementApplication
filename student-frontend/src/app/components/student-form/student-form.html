<section class="card">

  <h2>Créer un étudiant</h2>

  <form
    [formGroup]="studentForm"
    (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="firstName">Prénom</label>

      <input
        id="firstName"
        type="text"
        formControlName="firstName"
        placeholder="Prénom">

      @if (isInvalid('firstName')) {
        <small class="error">
          Le prénom est obligatoire.
        </small>
      }
    </div>

    <div class="form-group">
      <label for="lastName">Nom</label>

      <input
        id="lastName"
        type="text"
        formControlName="lastName"
        placeholder="Nom">

      @if (isInvalid('lastName')) {
        <small class="error">
          Le nom est obligatoire.
        </small>
      }
    </div>

    <div class="form-group">
      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="student@test.com">

      @if (isInvalid('email')) {
        <small class="error">
          Une adresse email valide est obligatoire.
        </small>
      }
    </div>

    <div class="form-group">
      <label for="classroom">Classe</label>

      <input
        id="classroom"
        type="text"
        formControlName="classroom"
        placeholder="QA Training">
    </div>

    <button
      type="submit"
      [disabled]="isSubmitting">

      @if (isSubmitting) {
        Création en cours...
      } @else {
        Créer l’étudiant
      }

    </button>

  </form>

  @if (successMessage) {
    <p class="success">
      {{ successMessage }}
    </p>
  }

  @if (errorMessage) {
    <p class="error">
      {{ errorMessage }}
    </p>
  }

</section>
